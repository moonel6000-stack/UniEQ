name: Build SysEQ
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
      - name: Build rootless
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless messages=yes
      - uses: actions/upload-artifact@v4
        with:
          name: SysEQ-deb
          path: packages/*.deb
